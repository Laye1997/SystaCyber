{% extends "base.html" %}
{% block title %}Nouvelle organisation{% endblock %}
{% block body %}
<header class="topbar">
  {% include "includes/logo.html" with tag="CyberSécurité" %}
  <nav><a href="{% url 'tableau_de_bord' %}">Retour</a></nav>
</header>
<div class="wrap" style="max-width:640px">
  <h1 class="page-title">Organisation cliente</h1>
  <form method="post" class="card">
    {% csrf_token %}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    {{ form.as_p }}
    <div style="margin-top:1rem;display:flex;gap:.5rem;align-items:center">
      <button type="submit">Enregistrer</button>
      <a class="btn ghost" href="{% if next == 'campagne' %}{% url 'campagne_creer' %}{% else %}{% url 'tableau_de_bord' %}{% endif %}">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
