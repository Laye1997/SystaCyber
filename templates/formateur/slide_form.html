{% extends "base.html" %}
{% block title %}Modifier la slide{% endblock %}
{% block body %}
<header class="topbar">
  {% include "includes/logo.html" with tag="CyberSécurité" %}
  <nav><a href="{% url 'pack_contenu' %}">Pack</a></nav>
</header>
<div class="wrap" style="max-width:800px">
  <p class="help">{{ slide.module }}</p>
  <h1 class="page-title">Modifier la slide</h1>
  <form method="post" class="card" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" style="margin-top:1rem">Enregistrer</button>
  </form>
</div>
{% endblock %}
