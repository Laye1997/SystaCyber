{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block body_class %}phone{% endblock %}
{% block body %}
<div class="wrap" style="max-width:400px;padding-top:2.5rem">
  <div class="card">
    <h1 class="page-title" style="text-align:center">Portail {{ entreprise }}</h1>
    <p class="help" style="text-align:center">Connectez-vous pour continuer.</p>
    {# Faux formulaire : aucune donnée saisie n'est enregistrée. #}
    <form method="post" autocomplete="off">
      {% csrf_token %}
      <label>Identifiant</label>
      <input type="text" name="u" autocomplete="off">
      <label>Mot de passe</label>
      <input type="password" name="p" autocomplete="off">
      <button type="submit" class="btn block" style="margin-top:1rem">Se connecter</button>
    </form>
  </div>
</div>
{% endblock %}
