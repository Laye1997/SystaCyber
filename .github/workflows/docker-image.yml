name: Build and push Docker image

# Construit l'image sur les serveurs GitHub et la pousse sur Docker Hub.
# Un seul secret requis : DOCKERHUB_TOKEN (l'identifiant laye1997 est public).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: laye1997
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et pousser l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: docker.io/laye1997/systacyber:latest
